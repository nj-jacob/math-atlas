# Publishes Atlas to Firebase (ontario-math-atlas.web.app) every time main changes, but only after the
# automatic checks (tests/run.js) pass. The Language pages come from the language-atlas repository and are
# published under /language/. When language-atlas main changes, its own workflow runs its checks and then
# asks this one to publish again (the "language-updated" event).
# Needs two repository secrets (see SETUP.md):
#   FIREBASE_SERVICE_ACCOUNT: the JSON key from Firebase console > Project settings > Service accounts.
#   ATLAS_TOKEN: a GitHub token that can read language-atlas. Without it, the site is published without Language.
name: Publish to Firebase
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [language-updated]
  workflow_dispatch:
concurrency: deploy
jobs:
  # The automatic checks run first. If any fail, nothing is published and the live site stays as it was.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the browser used by the checks
        working-directory: tests
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run the checks
        working-directory: tests
        run: npm test
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add the Language pages under /language/
        env:
          TOKEN: ${{ secrets.ATLAS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::warning::ATLAS_TOKEN secret is not set yet, so Language was not included."; exit 0; fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/nj-jacob/language-atlas.git" language
          rm -rf language/.git
      - name: Write the service account key
        id: key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::warning::FIREBASE_SERVICE_ACCOUNT secret is not set yet, so nothing was published."; exit 0; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "ready=yes" >> "$GITHUB_OUTPUT"
      - name: Deploy site and privacy rules
        if: steps.key.outputs.ready == 'yes'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@15 deploy --project ontario-math-atlas --non-interactive --force
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
