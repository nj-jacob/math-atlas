# Runs the automatic checks (tests/run.js) on every pull request, once per change.
# A pull request shows a red cross if anything is broken. See docs/CHECKS.md.
# main is checked by the publish workflow before it publishes.
name: Checks
on:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the browser used by the checks
        working-directory: tests
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run the checks
        working-directory: tests
        run: npm test
